name: Package Catalog

on:
  push:
    branches: [main]
    paths:
      - catalog.yaml
      - scripts/build_catalog.py
      - tests/**
      - .github/workflows/catalog.yml
  pull_request:
    paths:
      - catalog.yaml
      - scripts/build_catalog.py
      - tests/**
      - .github/workflows/catalog.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: package-catalog-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build package catalog
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyyaml markdown bleach pygments pymdown-extensions
      - run: python -m unittest discover -s tests
      - name: Generate catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_catalog.py
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public
      - name: Deploy Pages (attempt 1)
        id: deploy_pages_1
        uses: actions/deploy-pages@v4
        if: github.event_name != 'pull_request'
        continue-on-error: true
      - name: Deploy Pages (attempt 2)
        id: deploy_pages_2
        uses: actions/deploy-pages@v4
        if: github.event_name != 'pull_request' && steps.deploy_pages_1.outcome == 'failure'
        continue-on-error: true
      - name: Deploy Pages (attempt 3)
        id: deploy_pages_3
        uses: actions/deploy-pages@v4
        if: github.event_name != 'pull_request' && steps.deploy_pages_1.outcome == 'failure' && steps.deploy_pages_2.outcome == 'failure'
        continue-on-error: true
      - name: Check Pages deployment result
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ "${{ steps.deploy_pages_1.outcome }}" = "success" ]; then
            exit 0
          fi
          if [ "${{ steps.deploy_pages_2.outcome }}" = "success" ]; then
            exit 0
          fi
          if [ "${{ steps.deploy_pages_3.outcome }}" = "success" ]; then
            exit 0
          fi
          echo "GitHub Pages deployment failed after 3 attempts"
          exit 1
      - name: Commit generated catalog
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md generated public
          if git diff --cached --quiet; then
            echo "generated catalog unchanged"
            exit 0
          fi
          git commit -m "catalog: update generated package index [skip ci]"
          git pull --rebase origin main
          git push
